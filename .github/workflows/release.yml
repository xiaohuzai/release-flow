# 共享发版（workflow_call）：browsa / pi-feishu-notify / agent-bridge 共用一份实现。
# 约定（tag v 前缀、--merge --delete-branch、dev 快进、产物自动分流、版本 PR
# 安全阀、PAT 双模式、幂等自愈）见 release-flow/README.md。真跑实证史：
# v0.40.4 三次实跑踩出全部分支（仓库开关/action_required/BEHIND/timeout），
# v0.40.5 PAT 直通 6 秒收口；本文件是那套逻辑的收编版。
name: Release

on:
  workflow_call:
    inputs:
      version:
        description: '版本号（如 0.41.0），留空用 package.json 当前值'
        type: string
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # ── 验证结果按内容树复用（与共享 ci.yml 同一缓存空间）──────────────
      # bump 步虽在验证前，但 bump 当时尚未提交——HEAD^{tree} = 这次要发的
      # 内容树（CI 刚全量测过的那份）。命中即复用，发版不重复跑全量。
      - name: Compute tree hash
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Lookup previous verify result
        id: verifycache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .verify-pass
          key: verify-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}
          lookup-only: true

      # Bump version（package.json + package-lock；附属文件由各仓 postversion
      # 钩子同步，如 browsa 的 manifest.json）。输入版本 == 当前版本时跳过
      # npm version（--allow-same-version），覆盖"发当前已 bump 未发布的版本"。
      # 输入可带可选 v 前缀，先剥掉再比较。版本回退防护：低于当前版本直接拒绝。
      - name: Bump version
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          INPUT="${VERSION_INPUT#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$INPUT" ] && [ "$INPUT" != "$CURRENT" ]; then
            LOWER=$(node -e "const p=s=>s.split('.').map(Number);const i=p('$INPUT'),c=p('$CURRENT');for(let k=0;k<3;k++){if(i[k]!==c[k]){console.log(i[k]<c[k]?'yes':'no');process.exit(0)}}console.log('no')")
            if [ "$LOWER" = "yes" ]; then
              echo "::error::输入版本 v$INPUT 低于当前 v$CURRENT —— 版本不能回退。留空输入按当前版本发。"
              exit 1
            fi
            npm version "$INPUT" --no-git-tag-version --allow-same-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          # 产物约定分流：带 package script → zip；否则 npm publish
          if node -e "process.exit(require('./package.json').scripts?.package ? 0 : 1)"; then
            echo "kind=zip" >> "$GITHUB_OUTPUT"
          else
            echo "kind=npm" >> "$GITHUB_OUTPUT"
          fi
          # npm 模式防呆：已发布版本跳过 publish（幂等重跑）；未发布必须高于
          # npm latest（发旧版会把 latest 标签指回去）
          if [ "$(node -e "console.log(require('./package.json').scripts?.package ? 'zip' : 'npm')")" = "npm" ]; then
            NAME=$(node -p "require('./package.json').name")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "exists_on_npm=true" >> "$GITHUB_OUTPUT"
              echo "Version $VERSION already on npm — will skip publish (idempotent re-run)"
            else
              echo "exists_on_npm=false" >> "$GITHUB_OUTPUT"
              NPM_LATEST=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
              LOWEST=$(printf '%s\n%s\n' "$NPM_LATEST" "$VERSION" | sort -V | head -n 1)
              if [ "$LOWEST" = "$VERSION" ]; then
                echo "::error::Version $VERSION is not higher than published latest ($NPM_LATEST)"
                exit 1
              fi
            fi
          else
            echo "exists_on_npm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse verify result
        if: steps.verifycache.outputs.cache-hit == 'true'
        run: echo "::notice::测试结果复用自同树同环境的既有记录（tree ${{ steps.tree.outputs.hash }}）"

      - name: Verify (typecheck + test + compat)
        if: steps.verifycache.outputs.cache-hit != 'true'
        run: |
          npm run typecheck --if-present
          npm test
          npm run check-compat --if-present

      - name: Record verify result
        if: steps.verifycache.outputs.cache-hit != 'true' && success()
        run: echo "passed by ${{ github.sha }} at $(date -u +%FT%TZ)" > .verify-pass

      - name: Save verify result
        if: steps.verifycache.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .verify-pass
          key: verify-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}

      - name: Build zip
        if: steps.ver.outputs.kind == 'zip'
        run: npm run package

      - name: Publish to npm
        if: steps.ver.outputs.kind == 'npm' && steps.ver.outputs.exists_on_npm != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump + push tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="release/v$VERSION"
          git fetch origin --tags --quiet
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            # tag 已存在 = 上次发版跑到一半的残留（tag 推送在 release 创建之前）。
            # release 也在 → 已完整发过，直接收尾（PR 步仍会补齐版本号 PR）；
            # release 缺失 → 跳过 bump/tag，由 Create 步骤补建——「删 tag 重来」
            # 变成「重跑一次」。重跑补旧版本已被版本回退防护挡住。
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::notice::v$VERSION 已完整发布（tag + release 均在）——本次无事可做。"
            else
              echo "::notice::tag v$VERSION 已存在但 release 缺失——跳过 bump/tag，按当前代码补建 release。"
            fi
            exit 0
          fi
          # git add -u：只 stage npm version（+ postversion 钩子）实际改的文件
          # ——版本文件清单无需每仓配置。
          git add -u
          if ! git diff --cached --quiet; then
            # [skip ci] 按模式分流（版本 PR 不跑 test）：PAT 模式带 [skip ci]
            # （--admin 直合，不需要检查；发版 run 刚在同一内容树全量验证过）；
            # 无 PAT 不带（PR 要靠 pull_request CI 产出必需检查，且 CI run 会
            # 停在 action_required 等管理员批准一次——防递归策略）。
            if [ -n "$RELEASE_PAT" ]; then
              git commit -m "chore: release v$VERSION [skip ci]"
            else
              git commit -m "chore: release v$VERSION"
            fi
          fi
          git tag -a "v$VERSION" -m "release v$VERSION"
          # release/vX 分支：tag 可达性 + 版本号 PR 的头。推不动不阻塞。
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH" --force || echo "::warning::release 分支推送失败——tag 指向的提交将仅由 tag 引用保持可达"
          git push origin "v$VERSION"
          # bump 顺手快进 dev（resting 态 dev==main 纯 FF）：否则下个 dev→main
          # PR 会带回旧版本号。dev 已分叉被拒时仅 warning。
          git push origin "HEAD:refs/heads/dev" || echo "::warning::bump 未快进到 dev（dev 已分叉）——下个 dev→main PR 会带回旧版本号，合并后手动对齐"

      # 发布顺序（v0.35.11 复盘定型）：先发布、后升级 notes——generate-notes
      # 后端对刚推 tag 的 404 滞后实测 30s~1h+ 波动，release 不等它：
      #   1) 先试一次 generate-notes（成功即带完整 notes，常态路径）；
      #   2) 404 → 本地 git log 兜底立即发布（zip/npm 包是主要交付物）；
      #   3) 发布后 ~2 分钟窗口升级 notes，失败 warning 给手动刷新命令。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PREV=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -vE "^v?$VERSION$" | head -1)
          ARGS=(releases/generate-notes -f tag_name="v$VERSION")
          if [ -n "$PREV" ]; then ARGS+=(-f previous_tag_name="$PREV"); fi
          UPGRADED=""
          if NOTES=$(gh api "${ARGS[@]}" -q .body); then
            UPGRADED=1
          else
            NOTES=""
          fi
          if [ -z "$NOTES" ]; then
            RANGE="v$VERSION"
            [ -n "$PREV" ] && RANGE="$PREV..v$VERSION"
            NOTES=$(git log --format='- %s' "$RANGE")
            [ -z "$NOTES" ] && NOTES="release v$VERSION"
          fi
          PREEXIST=""
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            PREEXIST=1
            echo "::notice::release v$VERSION 已存在——跳过创建，仅尝试升级 notes。"
          else
            if [ "${{ steps.ver.outputs.kind }}" = "zip" ]; then
              gh release create "v$VERSION" *.zip --title "v$VERSION" --notes "$NOTES"
            else
              gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES"
            fi
          fi
          if [ -z "$UPGRADED" ]; then
            for i in $(seq 1 6); do
              sleep 20
              if NEW=$(gh api "${ARGS[@]}" -q .body); then
                if gh release edit "v$VERSION" --notes "$NEW" >/dev/null; then
                  echo "::notice::notes 已升级为 generate-notes 版（第 $i 次重试）"
                  UPGRADED=1
                  break
                fi
              fi
            done
            if [ -z "$UPGRADED" ]; then
              echo "::warning::generate-notes 后端 ~2 分钟内未恢复，release 已带本地兜底 notes 发布。后端恢复后手动刷新："
              echo "::warning::gh api \"repos/$GITHUB_REPOSITORY/releases/generate-notes\" -f tag_name=v$VERSION -f previous_tag_name=$PREV -q .body | gh release edit v$VERSION --notes-file -"
            fi
          elif [ -n "$PREEXIST" ]; then
            gh release edit "v$VERSION" --notes "$NOTES" >/dev/null && echo "::notice::旧兜底 notes 已升级为 generate-notes 版"
          fi

      # 版本号 PR 自动开、自动合（pi-feishu-notify 模式 + browsa v0.40.4 三次实跑
      # 增强）。放最后：产物已落地，本步失败不影响发布。分支存在性守卫（而非
      # pr_needed 门）——「上次死在本步」的恢复就是重跑一次。历史旧 release 无
      # release/vX 分支 → 无事可做。
      - name: Open version bump PR and auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          RELEASE_BRANCH="release/v$VERSION"
          if ! git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | grep -q .; then
            echo "No $RELEASE_BRANCH branch on remote — historical release, nothing to do."
            exit 0
          fi
          PR_URL=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            if gh pr list --base main --head "$RELEASE_BRANCH" --state merged --json number --jq '.[0].number' | grep -q '[0-9]'; then
              echo "Version bump PR already merged, nothing to do."
              exit 0
            fi
            PR_URL=$(gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release v$VERSION" \
              --body "发版流程自动创建：把版本号文件对齐到已发布的 v$VERSION。仅版本号变更的 PR 由流程自动合并，无需人工处理。") \
              || { echo "::error::版本号 PR 创建失败（$RELEASE_BRANCH）——请手动创建并合并（v$VERSION 已发布）"; exit 1; }
          fi
          echo "Version bump PR: $PR_URL"
          AUTO=0
          for i in $(seq 1 240); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "Version bump PR merged: $PR_URL"
              exit 0
            fi
            if [ "$STATE" != "OPEN" ]; then
              echo "::error::版本号 PR 状态异常（$STATE）。v$VERSION 已发布，请人工检查：$PR_URL"
              exit 1
            fi
            # 差异审计每轮重算（update-branch 后会变）：空差异 = 版本号已随
            # 其它 PR 进 main → 关闭收尾；混入非版本号文件 → 安全阀停下交人工。
            DIFF_FILES=$(gh pr diff "$PR_URL" --name-only | grep -c . || true)
            EXTRA=$(gh pr diff "$PR_URL" --name-only | grep -cvE '^(package(-lock)?\.json|manifest\.json)$' || true)
            if [ "$DIFF_FILES" -eq 0 ]; then
              gh pr close "$PR_URL" --comment "版本号已随其它变更进入 main，本 PR 无差异——发版流程自动关闭。"
              echo "Version already aligned on main; empty-diff PR closed. Done."
              exit 0
            fi
            if [ "$EXTRA" -ne 0 ]; then
              echo "::error::PR $PR_URL 除版本号外还有其它变更，已停止自动合并，请人工审查"
              exit 1
            fi
            MS=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$MS" = "BEHIND" ]; then
              gh pr update-branch "$PR_URL" >/dev/null 2>&1 \
                && { echo "Branch was behind base — update-branch issued, waiting for its check"; sleep 30; continue; }
            fi
            if gh pr checks "$PR_URL" 2>/dev/null | grep -qw fail; then
              echo "::error::CI 检查未通过，版本号 PR 无法自动合入。v$VERSION 已发布成功，请修复后手动合并：$PR_URL"
              gh pr checks "$PR_URL" || true
              exit 1
            fi
            # PAT 模式直通：--admin 绕过必需检查与 up-to-date 直接合并（无 CI
            # 即无批准问题）。github.token 非 admin 走不到，落回 auto-merge 循环。
            if [ -n "$RELEASE_PAT" ]; then
              if gh pr merge "$PR_URL" --merge --admin --delete-branch >/dev/null 2>&1; then
                echo "Version bump PR merged (--admin bypass): $PR_URL"
                exit 0
              fi
            fi
            if [ "$AUTO" = 0 ]; then
              if gh pr merge "$PR_URL" --auto --merge --delete-branch >/dev/null 2>&1; then
                AUTO=1
                echo "Auto-merge enabled for $PR_URL (waiting for required checks)"
              else
                gh pr merge "$PR_URL" --merge --delete-branch >/dev/null 2>&1 \
                  && { echo "Version bump PR merged directly: $PR_URL"; exit 0; }
              fi
            fi
            sleep 5
          done
          echo "::error::版本号 PR 未自动合入（最后一次 state=$STATE / mergeState=$MS）。v$VERSION 已发布成功，请手动处理：$PR_URL"
          gh pr checks "$PR_URL" || true
          exit 1
